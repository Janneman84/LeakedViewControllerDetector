name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.destination }}
    runs-on: macos-latest
    strategy:
      matrix:
        destination:
          - 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          - 'platform=tvOS Simulator,name=Apple TV,OS=latest'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Run tests
      run: xcodebuild -scheme LeakedViewControllerDetector -destination '${{ matrix.destination }}' test

