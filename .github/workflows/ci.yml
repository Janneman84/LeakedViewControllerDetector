name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test with xcodebuild
    runs-on: macos-15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'
    
    - name: Run tests with xcodebuild
      run: xcodebuild -scheme LeakedViewControllerDetector -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' test
